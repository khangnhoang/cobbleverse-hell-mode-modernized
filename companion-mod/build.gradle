plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.0"
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.0.0"
    runtimeOnly "com.electronwill.night-config:core:3.8.0"
    runtimeOnly "com.electronwill.night-config:toml:3.8.0"

    // Cobbleverse local mods directory (Cobblemon, RCT, RCT API)
    def curseforgeMods = providers.gradleProperty('cobbleverseModsDir')
        .orElse(providers.environmentVariable('COBBLEVERSE_MODS_DIR'))
        .orElse("c:/Users/khang/curseforge/minecraft/Instances/COBBLEVERSE - Pokemon Adventure [Cobblemon]/mods")
        .get()

    modImplementation files("${curseforgeMods}/Cobblemon-fabric-1.7.3+1.21.1.jar")
    modImplementation files("${curseforgeMods}/rctapi-fabric-1.21.1-0.15.2-beta.jar")
    modImplementation files("${curseforgeMods}/rctmod-fabric-1.21.1-0.18.1-beta.jar")
    modImplementation files("${curseforgeMods}/rbrctai-fabric-1.21.1-0.15.4-beta.jar")
    modLocalRuntime files("${curseforgeMods}/architectury-13.0.8-fabric.jar")
    modLocalRuntime files("${curseforgeMods}/ForgeConfigAPIPort-v21.1.6-1.21.1-Fabric.jar")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
